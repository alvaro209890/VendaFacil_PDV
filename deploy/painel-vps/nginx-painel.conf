# Nginx reverse proxy para o Painel SaaS VendaFácil.
# Coloque em /etc/nginx/sites-available/ e ative com symlink em sites-enabled.
# Depois rode o certbot para HTTPS:  sudo certbot --nginx -d painel.SEUDOMINIO.com

server {
    listen 80;
    server_name painel.SEUDOMINIO.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
